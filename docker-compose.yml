version: "3.9"

services:
  frontend-builder:
    profiles: ["dev"]
    build: ./frontend
    command: "npm run build"
    volumes:
      - frontend_dist:/dist

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - chat
      - guacd
      - tomcat
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/data/app.db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-secret-key-change-in-production
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - redis
    restart: unless-stopped

  chat:
    build: ./chat
    ports:
      - "7000:7000"
    environment:
      - DB_PATH=/data/chat.db
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

  guacd:
    image: guacamole/guacd:1.5.5
    ports:
      - "4822:4822"
    deploy:
      resources:
        limits:
          memory: 100M
          cpus: '0.2'
    restart: unless-stopped

  tomcat:
    image: guacamole/guacamole:1.5.5
    ports:
      - "8080:8080"
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      MYSQL_DISABLED: "true"
      POSTGRES_ENABLED: "false"
      GUACAMOLE_HOME: /guac-home
    volumes:
      - ./guac_home:/guac-home
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    depends_on:
      guacd:
        condition: service_healthy
    restart: unless-stopped

  manager:
    build: ./manager
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_PATH=/data/app.db
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
    depends_on:
      - redis
      - backend
    restart: unless-stopped

networks:
  default:
    driver: bridge

volumes:
  redis_data:
  frontend_dist:
